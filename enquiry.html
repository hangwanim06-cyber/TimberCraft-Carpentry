<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TimberCraft Carpentry | Enquiry</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <h1>TimberCraft Carpentry</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="about.html">About Us</a>

            <a href="services.html">Services</a>

            <a href="enquiry.html">Enquiry</a>

            <a href="contact.html">Contact</a>

        </nav>

    </header>


    <main>

        <section>

            <h2>Request a Quote</h2>

            <p>
                Complete the form below and tell us
                about your project.
            </p>


            <form>

                <label for="name">
                    Full Name:
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required>


                <br><br>


                <label for="email">
                    Email Address:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required>


                <br><br>


                <label for="phone">
                    Phone Number:
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    required>


                <br><br>
<!-- Preferred Contact Method -->
<label for="contact">
    Preferred Contact Method:
</label>

<select id="contact" name="contact" required>

    <option value="">
        Select contact method
    </option>

    <option value="email">
        Email
    </option>

    <option value="phone">
        Phone Call
    </option>

</select>

<br><br>

                <label for="service">
                    Service Required:
                </label>

                <select
                    id="service"
                    name="service"
                    required>

                    <option value="">
                        Select a service
                    </option>

                    <option value="furniture">
                        Custom Furniture
                    </option>

                    <option value="cabinetry">
                        Cabinetry
                    </option>

                    <option value="repairs">
                        Wood Repairs
                    </option>

                    <option value="shelving">
                        Shelving
                    </option>

                    <option value="doors">
                        Door and Frame Work
                    </option>

                    <option value="refinishing">
                        Refinishing
                    </option>

                </select>


                <br><br>


                <label for="budget">
                    Approximate Budget:
                </label>

                <select id="budget" name="budget">

                    <option>
                        Under R1,000
                    </option>

                    <option>
                        R1,000 - R2,500
                    </option>

                    <option>
                        R2,501 - R5,000
                    </option>

                    <option>
                        R5,000+
                    </option>

                </select>


                <br><br>


                <label for="message">
                    Project Description:
                </label>

                <br>

                <textarea
                    id="message"
                    name="message"
                    rows="7"
                    required>
                </textarea>


                <br><br>


                <button type="submit">
                    Submit Enquiry
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 TimberCraft Carpentry</p>

    </footer>

    <script src="script.js"></script>
    
</body>

</html>
